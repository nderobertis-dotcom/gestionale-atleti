name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 8 */5 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase - progetto 1
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://brwkwlyxkptzmkzkvava.supabase.co/auth/v1/health")
          echo "Progetto 1 - HTTP Status: $STATUS"

      - name: Ping Supabase - progetto 2
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://dfppifjbohdslfqggkhi.supabase.co/auth/v1/health")
          echo "Progetto 2 - HTTP Status: $STATUS"
