name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 8 */5 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase - gestionale_atleti
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://dfppifjbohdslfqggkhi.supabase.co/auth/v1/health")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" -gt 0 ]; then
            echo "✅ Supabase è attivo (status $STATUS)"
          else
            echo "❌ Nessuna risposta da Supabase"
            exit 1
          fi
